  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(34px,4vw,56px);margin:0 0 20px;letter-spacing:-.01em;color:var(--text,#F6F6F5);text-wrap:balance;\">{{ L.secFeed.title }}<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.6;color:var(--sub,#9C9CA2);margin:0;\">{{ L.secFeed.sub }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"columns:3;column-gap:16px;\">\n      <sc-for list=\"{{ feed }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div data-reveal=\"\" style=\"break-inside:avoid;margin-bottom:16px;border:1px solid var(--line,rgba(255,255,255,.12));border-radius:12px;padding:28px 26px;background:var(--elev,#101012);\">\n          <div style=\"font-family:'Chakra Petch';font-size:40px;line-height:.6;color:var(--faint,#5B5B61);margin-bottom:14px;\">“<\u002Fdiv>\n          <p style=\"font-size:16px;line-height:1.6;color:var(--text,#F6F6F5);margin:0 0 22px;\">{{ f.q }}<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:12px;\">\n            <div style=\"width:40px;height:40px;border-radius:50%;background:var(--chip,rgba(255,255,255,.06));border:1px solid var(--line,rgba(255,255,255,.12));display:flex;align-items:center;justify-content:center;font-family:'Chakra Petch';font-weight:600;font-size:15px;color:var(--text,#F6F6F5);\">{{ f.i }}<\u002Fdiv>\n            <div>\n              <div style=\"font-size:14px;font-weight:600;color:var(--text,#F6F6F5);\">{{ f.n }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:var(--sub,#9C9CA2);\">{{ f.r }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===== CONTACT PAGE ===== -->\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1240px;margin:0 auto;padding:80px 32px 96px;\">\n    <div data-reveal=\"\" style=\"max-width:760px;margin-bottom:52px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub,#9C9CA2);margin-bottom:16px;\">{{ L.secContact.tag }}<\u002Fdiv>\n      <h1 style=\"font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(34px,4.4vw,58px);margin:0 0 20px;letter-spacing:-.01em;color:var(--text,#F6F6F5);text-wrap:balance;\">{{ L.secContact.title }}<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.6;color:var(--sub,#9C9CA2);margin:0;max-width:480px;\">{{ L.secContact.sub }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n      <sc-for list=\"{{ contactMethods }}\" as=\"cm\" hint-placeholder-count=\"2\">\n        <a data-reveal=\"\" href=\"{{ cm.href }}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none;border:1px solid var(--line,rgba(255,255,255,.12));border-radius:16px;padding:38px 34px;background:var(--elev,#101012);display:flex;flex-direction:column;gap:26px;transition:transform .28s cubic-bezier(.2,.7,.2,1),border-color .28s,background .28s;\" style-hover=\"transform:translateY(-6px);border-color:var(--lineS,rgba(255,255,255,.32));background:var(--surface,#161619);\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint,#5B5B61);\">{{ cm.k }}<\u002Fspan>\n            <span style=\"font-size:22px;color:var(--sub,#9C9CA2);\">↗<\u002Fspan>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:clamp(24px,2.6vw,34px);color:var(--text,#F6F6F5);word-break:break-word;\">{{ cm.v }}<\u002Fdiv>\n            <div style=\"margin-top:12px;font-size:14.5px;color:var(--sub,#9C9CA2);\">{{ cm.hint }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"margin-top:24px;border-top:1px solid var(--line,rgba(255,255,255,.12));padding-top:26px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint,#5B5B61);margin-bottom:6px;\">{{ L.secContact.locLabel }}<\u002Fdiv>\n      <div style=\"font-size:16px;color:var(--text,#F6F6F5);\">Budapest · Kyiv · Remote<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===== FOOTER ===== -->\n  <footer style=\"border-top:1px solid var(--line,rgba(255,255,255,.10));\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:56px 32px 44px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;\">\n      <div>\n        <img data-sikra-img=\"logo\" src=\"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" alt=\"Sikra\" style=\"height:24px;width:auto;display:block;margin-bottom:18px;\">\n        <p style=\"font-size:14.5px;line-height:1.6;color:var(--sub,#9C9CA2);margin:0;max-width:300px;\">{{ L.footer.tagline }}<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint,#5B5B61);margin-bottom:16px;\">{{ L.footer.nav }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ navLinks }}\" as=\"item\" hint-placeholder-count=\"5\">\n            <a onclick=\"{{ item.go }}\" style=\"cursor:pointer;font-size:14.5px;color:var(--sub,#9C9CA2);transition:color .2s;width:fit-content;\" style-hover=\"color:var(--text,#F6F6F5);\">{{ item.label }}<\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint,#5B5B61);margin-bottom:16px;\">{{ L.footer.contactT }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14.5px;color:var(--sub,#9C9CA2);\">\n          <span>hello@sikra.dev<\u002Fspan>\n          <span>Budapest · Kyiv · Remote<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--line,rgba(255,255,255,.10));\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:22px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint,#5B5B61);\">\n        <span>© 2026 Sikra. {{ L.footer.rights }}<\u002Fspan>\n        <span>{{ L.footer.made }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ru&quot;,&quot;en&quot;,&quot;uk&quot;,&quot;hu&quot;],&quot;default&quot;:&quot;ru&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p){\n    super(p);\n    this.PAGES = ['home','services','stack','about','feedback','contact'];\n    const ls = (k,d)=>{ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } };\n    let hp = (typeof location!=='undefined' ? (location.hash||'') : '').replace('#','').replace('/','');\n    if(!this.PAGES.includes(hp)) hp='home';\n    this.state = {\n      theme: 'dark',\n      lang:  ls('sikra-lang',  this.props.defaultLang  || 'ru'),\n      page:  hp,\n      openTech: 0,\n      sent: false\n    };\n    this.TOOLS = {\n      front:  ['React','Next.js','TypeScript','Tailwind CSS','Vite','Framer Motion','Zustand'],\n      back:   ['Supabase','PostgreSQL','Edge Functions','Row-Level Security','Auth','Storage','Realtime','Node.js'],\n      uiux:   ['Figma','Design Systems','Prototyping','User Research','Motion','Accessibility'],\n      mobile: ['React Native','Expo','PWA','Responsive','App Store','Google Play']\n    };\n    this.T = this.buildDict();\n  }\n\n  setTheme(v){ try{ localStorage.setItem('sikra-theme',v); }catch(e){} this.setState({theme:v}); }\n  toggleTheme(){ this.setTheme(this.state.theme==='dark'?'light':'dark'); }\n  setLang(v){ try{ localStorage.setItem('sikra-lang',v); }catch(e){} this.setState({lang:v}); }\n  goTo(pg){\n    if(pg==='home'){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }\n    else { try{ location.hash = pg; }catch(e){} }\n    this.setState({page:pg, sent:false});\n  }\n  syncHash(){\n    let hp=(location.hash||'').replace('#','').replace('/','');\n    if(!this.PAGES.includes(hp)) hp='home';\n    if(hp!==this.state.page) this.setState({page:hp});\n  }\n  toggleTech(i){ this.setState(s=>({ openTech: s.openTech===i ? -1 : i })); }\n  submit(e){ e.preventDefault(); this.setState({sent:true}); }\n\n  initReveal(){\n    const root=document.getElementById('sikra-root'); if(!root) return;\n    const els=[...root.querySelectorAll('[data-reveal]')];\n    if(this.props.reduceMotion){ els.forEach(e=>{e.style.opacity='1';e.style.transform='none';}); return; }\n    const vh=window.innerHeight||800;\n    const io=new IntersectionObserver((ents)=>{\n      ents.forEach(en=>{ if(en.isIntersecting){ en.target.style.opacity='1'; en.target.style.transform='none'; io.unobserve(en.target); } });\n    },{threshold:0.08, rootMargin:'0px 0px -5% 0px'});\n    els.forEach((e,i)=>{\n      const r=e.getBoundingClientRect();\n      const inView = r.top < vh*0.92 && r.bottom > -40;\n      e.style.transition='opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)';\n      e.style.opacity='0';\n      e.style.transform='translateY(22px)';\n      if(inView){\n        e.style.transitionDelay=(Math.min(i,7)*0.05)+'s';\n        requestAnimationFrame(()=>requestAnimationFrame(()=>{ e.style.opacity='1'; e.style.transform='none'; }));\n      } else {\n        io.observe(e);\n      }\n    });\n    this.enhance();\n  }\n  showAll(){\n    const root=document.getElementById('sikra-root'); if(!root) return;\n    root.querySelectorAll('[data-reveal]').forEach(e=>{ e.style.opacity='1'; e.style.transform='none'; });\n    this.enhance();\n  }\n  enhance(){\n    this.splitReveal();\n    this.setupCounters();\n    this.setupHero();\n  }\n  splitReveal(){\n    if(this.props.reduceMotion) return;\n    const root=document.getElementById('sikra-root'); if(!root) return;\n    root.querySelectorAll('[data-split]').forEach(el=>{\n      if(el.getAttribute('data-split-done')==='1') return;\n      const txt=(el.getAttribute('data-text')||el.textContent||'').trim();\n      if(!txt) return;\n      el.setAttribute('data-text', txt);\n      el.setAttribute('data-split-done','1');\n      el.textContent='';\n      txt.split(' ').forEach((w,i)=>{\n        const wrap=document.createElement('span');\n        wrap.style.display='inline-block';\n        wrap.style.overflow='hidden';\n        wrap.style.verticalAlign='top';\n        wrap.style.paddingBottom='0.14em';\n        const inner=document.createElement('span');\n        inner.style.display='inline-block';\n        inner.textContent=w;\n        inner.style.transform='translateY(118%)';\n        inner.style.transition='transform .9s cubic-bezier(.16,.84,.28,1)';\n        inner.style.transitionDelay=(0.12+i*0.07)+'s';\n        wrap.appendChild(inner);\n        el.appendChild(wrap);\n        el.appendChild(document.createTextNode(' '));\n        requestAnimationFrame(()=>requestAnimationFrame(()=>{ inner.style.transform='translateY(0)'; }));\n      });\n    });\n  }\n  setupCounters(){\n    const root=document.getElementById('sikra-root'); if(!root) return;\n    const els=[...root.querySelectorAll('[data-counter]')];\n    if(this.props.reduceMotion){ els.forEach(e=>{ e.textContent=e.getAttribute('data-counter'); }); return; }\n    const run=(el)=>{\n      if(el.getAttribute('data-cnt-done')==='1') return;\n      el.setAttribute('data-cnt-done','1');\n      const raw=el.getAttribute('data-counter')||el.textContent||'';\n      const m=raw.match(/^(\\D*)(\\d[\\d.,]*)(\\D*)$/);\n      if(!m){ return; }\n      const pre=m[1], suf=m[3], target=parseFloat(m[2].replace(/,/g,''));\n      const dur=1200, t0=performance.now();\n      const step=(now)=>{ const p=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-p,3); el.textContent=pre+Math.round(target*e)+suf; if(p<1) requestAnimationFrame(step); };\n      el.textContent=pre+'0'+suf;\n      requestAnimationFrame(step);\n    };\n    const io=new IntersectionObserver((ents)=>{ ents.forEach(en=>{ if(en.isIntersecting){ run(en.target); io.unobserve(en.target); } }); },{threshold:0.4});\n    const vh=window.innerHeight||800;\n    els.forEach(el=>{ const r=el.getBoundingClientRect(); if(r.top<vh*0.9 && r.bottom>0){ run(el); } else { io.observe(el); } });\n  }\n  setupHero(){\n    if(this.props.reduceMotion) return;\n    const root=document.getElementById('sikra-root'); if(!root) return;\n    if(this._heroEl && this._heroMove){ this._heroEl.removeEventListener('pointermove', this._heroMove); this._heroEl.removeEventListener('pointerleave', this._heroLeave); this._heroEl=null; }\n    const hero=root.querySelector('[data-hero]'); if(!hero) return;\n    const glow=hero.querySelector('[data-hero-glow]');\n    const mark=hero.querySelector('[data-parallax]');\n    const cursor=hero.querySelector('[data-hero-cursor]');\n    let raf=0, mx=0, my=0, cx=0, cy=0, rect=null;\n    this._heroMove=(ev)=>{\n      rect=rect||hero.getBoundingClientRect();\n      mx=ev.clientX-rect.left; my=ev.clientY-rect.top; cx=ev.clientX; cy=ev.clientY;\n      if(glow) glow.style.opacity='1';\n      if(cursor){ cursor.style.opacity='1'; cursor.style.transform='translate('+cx+'px,'+cy+'px) translate(-50%,-50%) scale(1)'; }\n      if(!raf) raf=requestAnimationFrame(()=>{ raf=0; rect=hero.getBoundingClientRect();\n        if(glow){ glow.style.left=mx+'px'; glow.style.top=my+'px'; }\n        if(mark){ const dx=mx/rect.width-0.5, dy=my/rect.height-0.5; mark.style.transform='translate('+(dx*34)+'px,'+(dy*34)+'px)'; }\n      });\n    };\n    this._heroLeave=()=>{ if(glow) glow.style.opacity='0'; if(mark) mark.style.transform='translate(0,0)'; if(cursor){ cursor.style.opacity='0'; cursor.style.transform='translate('+cx+'px,'+cy+'px) translate(-50%,-50%) scale(0)'; } };\n    this._heroEl=hero;\n    hero.addEventListener('pointermove', this._heroMove);\n    hero.addEventListener('pointerleave', this._heroLeave);\n  }\n  applyTokens(){\n    const root=document.getElementById('sikra-root'); if(!root) return;\n    const t=this.tokens();\n    Object.keys(t).forEach(k=>root.style.setProperty(k, t[k]));\n    root.style.setProperty('background', t['--bg']);\n    root.style.setProperty('color', t['--text']);\n    const dark=this.state.theme==='dark';\n    const R=(window.__resources)||{};\n    const logo=dark?(R.logoDark||'assets/sikra-logo-dark.png'):(R.logoLight||'assets/sikra-logo-light.png');\n    const mark=dark?(R.markDark||'assets/sikra-mark-dark.png'):(R.markLight||'assets/sikra-mark-light.png');\n    root.querySelectorAll('[data-sikra-img=\"logo\"]').forEach(el=>{ if(el.getAttribute('src')!==logo) el.setAttribute('src',logo); });\n    root.querySelectorAll('[data-sikra-img=\"mark\"]').forEach(el=>{ if(el.getAttribute('src')!==mark) el.setAttribute('src',mark); });\n  }\n  componentDidMount(){\n    this._hh=()=>this.syncHash();\n    window.addEventListener('hashchange', this._hh);\n    this._navLastY=0;\n    this._navInit=false;\n    this._sc=(ev)=>{\n      let scroller = (ev && ev.target
